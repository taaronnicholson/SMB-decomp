# UxROM (mapper 2), 8 x 16KB PRG banks, CHR-RAM
MEMORY {
    HDR:    start = $0000, size = $0010, file = %O, fill = yes;
    BANK0:  start = $8000, size = $4000, file = %O, fill = yes;
    BANK1:  start = $8000, size = $4000, file = %O, fill = yes;
    BANK2:  start = $8000, size = $4000, file = %O, fill = yes;
    BANK3:  start = $8000, size = $4000, file = %O, fill = yes;
    BANK4:  start = $8000, size = $4000, file = %O, fill = yes;
    BANK5:  start = $8000, size = $4000, file = %O, fill = yes;
    BANK6:  start = $8000, size = $4000, file = %O, fill = yes;
    FIXED:  start = $C000, size = $4000, file = %O, fill = yes;
}
SEGMENTS {
    HEADER: load = HDR,   type = ro;
    BANK0:  load = BANK0, type = ro;
    BANK1:  load = BANK1, type = ro;
    BANK2:  load = BANK2, type = ro;
    BANK3:  load = BANK3, type = ro;
    BANK4:  load = BANK4, type = ro;
    BANK5:  load = BANK5, type = ro;
    BANK6:  load = BANK6, type = ro;
    FIXED:  load = FIXED, type = ro;
}
